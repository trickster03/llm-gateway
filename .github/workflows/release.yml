name: release
on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # required for AWS OIDC federation
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 537725238632.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE: llm-gateway

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::537725238632:role/github-actions-deployer
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker build -t "$ECR_REGISTRY/$IMAGE:$TAG" -t "$ECR_REGISTRY/$IMAGE:latest" .
          docker push "$ECR_REGISTRY/$IMAGE:$TAG"
          docker push "$ECR_REGISTRY/$IMAGE:latest"

      # The gateway proxy is lightweight, so it runs on the free-tier k3s box.
      # The manifest is shipped base64-encoded (avoids YAML-in-JSON quoting) and
      # applied on the box via SSM — the API server is never exposed publicly.
      # The heavy model backend stays on-demand and is pointed at via
      # UPSTREAM_BASE_URL; it is intentionally not deployed here.
      - name: Deploy proxy to k3s (apply + rollout via SSM)
        run: |
          B64=$(base64 < deploy/k8s.yaml | tr -d '\n')
          aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Role,Values=k3s" \
            --comment "Deploy llm-gateway ${GITHUB_REF_NAME}" \
            --parameters "commands=[\"echo $B64 | base64 -d > /tmp/llm-gateway.yaml\",\"/usr/local/bin/kubectl apply -f /tmp/llm-gateway.yaml\",\"/usr/local/bin/kubectl -n default rollout restart deployment/llm-gateway\",\"/usr/local/bin/kubectl -n default rollout status deployment/llm-gateway --timeout=120s\"]" \
            --query 'Command.CommandId' --output text
